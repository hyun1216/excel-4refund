[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payroll-amendment"
version = "0.1.0"
description = "근로소득 수정신고 로컬 자동화"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pdfplumber>=0.11,<1",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "pypdf>=5,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
payroll-amendment = "payroll_amendment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

